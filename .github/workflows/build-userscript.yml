name: Build userscript

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: node
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Check committed build
        run: git diff --exit-code -- dist/ModerationUltraMegaHelper.min.user.js

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_SHA:0:12}"
          asset="dist/ModerationUltraMegaHelper.min.user.js"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" \
              --target "$GITHUB_SHA" \
              --title "ModerationUltraMegaHelper ${GITHUB_SHA:0:7}" \
              --generate-notes \
              --latest
          fi
